<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessar meus cursos | Meu Checkout</title>
  <meta name="description" content="Recupere o acesso aos cursos que voce comprou. Enviamos um link seguro para o seu e-mail.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f7fb;
      color: #0f172a;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    .wrap { max-width: 440px; margin: 0 auto; }
    .brand {
      text-align: center;
      margin-bottom: 24px;
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }
    h1 {
      font-size: 1.4rem;
      line-height: 1.3;
      margin-bottom: 10px;
      text-align: center;
    }
    .lead {
      text-align: center;
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      background: #16a34a;
      color: #fff;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .msg {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
      display: none;
    }
    .msg.ok { display: block; background: #ecfdf5; color: #166534; }
    .msg.erro { display: block; background: #fef2f2; color: #b91c1c; }
    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #64748b;
    }
    .footer a { color: #16a34a; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Meu Checkout</div>
    <div class="card">
      <h1>Acesse seus cursos</h1>
      <p class="lead">
        Digite o e-mail usado na compra. Enviaremos um link seguro para liberar seus materiais.
      </p>

      <label for="email">E-mail da compra</label>
      <input id="email" type="email" placeholder="voce@email.com" autocomplete="email">

      <button type="button" id="btnEnviar">Enviar link de acesso</button>
      <div id="msg" class="msg"></div>
    </div>

    <div class="footer">
      Ainda nao comprou?
      <a href="./">Conheca nossos cursos</a>
    </div>
  </div>

  <script>
    const API = "https://zrycyjntfifuucrnmcuq.supabase.co/functions/v1/solicitar-acesso";
    const emailEl = document.getElementById("email");
    const btn = document.getElementById("btnEnviar");
    const msg = document.getElementById("msg");

    function show(text, tipo) {
      msg.textContent = text;
      msg.className = "msg " + tipo;
    }

    async function enviar() {
      const email = (emailEl.value || "").trim();
      if (!email || !email.includes("@")) {
        show("Digite um e-mail valido.", "erro");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Enviando...";
      msg.className = "msg";

      try {
        const resp = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await resp.json();

        if (!resp.ok || !data.sucesso) {
          throw new Error(data.erro || "Nao foi possivel enviar o link.");
        }

        show(
          data.mensagem ||
            "Se este e-mail tiver compras, voce recebera um link em instantes. Verifique tambem o spam.",
          "ok"
        );
      } catch (e) {
        show(e.message || "Erro ao solicitar acesso.", "erro");
      } finally {
        btn.disabled = false;
        btn.textContent = "Enviar link de acesso";
      }
    }

    btn.addEventListener("click", enviar);
    emailEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        enviar();
      }
    });
  </script>
</body>
</html>
