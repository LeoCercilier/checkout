<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    #mensagem {
      font-size: 18px;
      margin: 25px 0;
    }

    .confirmado {
      color: #16803c;
      font-weight: bold;
    }

    .aguardando {
      color: #b06b00;
    }

    .erro {
      color: #b00020;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Meu Infoproduto</h1>

    <div id="mensagem" class="aguardando">
      Verificando pagamento...
    </div>

    <p id="detalhes"></p>
  </div>

  <script>
    const API =
      "https://zrycyjntfifuucrnmcuq.supabase.co/functions/v1/consultar-pedido";

    const mensagem = document.getElementById("mensagem");
    const detalhes = document.getElementById("detalhes");

    async function verificarPagamento() {
      const externalReference =
        localStorage.getItem("checkout_external_reference");

      if (!externalReference) {
        mensagem.textContent = "Não foi possível localizar o pedido.";
        mensagem.className = "erro";
        return;
      }

      try {
        const resposta = await fetch(API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            external_reference: externalReference
          })
        });

        const resultado = await resposta.json();

        if (resultado.confirmado) {
          mensagem.textContent = "Pagamento confirmado! ✅";
          mensagem.className = "confirmado";

          detalhes.textContent =
            "Seu pagamento foi confirmado com sucesso.";
        } else {
          mensagem.textContent = "Aguardando confirmação do pagamento...";
          mensagem.className = "aguardando";

          detalhes.textContent =
            "Esta página verificará novamente em alguns segundos.";
        }
      } catch (erro) {
        mensagem.textContent =
          "Não foi possível verificar o pagamento agora.";
        mensagem.className = "erro";
      }
    }

    verificarPagamento();

    setInterval(verificarPagamento, 5000);
  </script>
</body>
</html>
