<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento | Cursos Técnicos Práticos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.35rem;
      line-height: 1.3;
    }

    #mensagem {
      font-size: 18px;
      margin: 25px 0;
    }

    .confirmado {
      color: #16803c;
      font-weight: bold;
    }

    .aguardando {
      color: #b06b00;
    }

    .erro {
      color: #b00020;
    }

    #area-download {
      display: none;
      margin-top: 25px;
    }

    #area-download p {
      color: #334155;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .botao-download {
      display: inline-block;
      width: 100%;
      max-width: 320px;
      padding: 16px 20px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .botao-download:hover { opacity: 0.92; }

    .botao-download:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #download-msg {
      margin-top: 14px;
      font-size: 14px;
      color: #64748b;
    }

    .download-erro { color: #b00020; }

    .pos-compra {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
    }

    .pos-compra a {
      color: #16a34a;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 id="tituloProduto">Seu curso digital</h1>

    <div id="mensagem" class="aguardando">
      Verificando pagamento...
    </div>

    <p id="detalhes"></p>

    <div id="area-download">
      <p>Seu pagamento foi confirmado.<br>Clique no botão abaixo para baixar o material.</p>
      <button id="btn-download" class="botao-download">
        Baixar meu material
      </button>
      <div id="download-msg"></div>

      <div class="pos-compra">
        Perdeu esta página ou trocou de celular?<br>
        <a href="./acesso.html">Acessar meus cursos com o e-mail da compra</a>
      </div>
    </div>
  </div>

  <script>
    const API_CONSULTAR =
      "https://zrycyjntfifuucrnmcuq.supabase.co/functions/v1/consultar-pedido";

    const API_DOWNLOAD =
      "https://zrycyjntfifuucrnmcuq.supabase.co/functions/v1/gerar-download";

    const NOMES = {
      1: 'Energia Solar Fotovoltaica — Guia Prático Essencial',
      2: 'Instalação e Manutenção de Ar-Condicionado Split'
    };

    const mensagem = document.getElementById("mensagem");
    const detalhes = document.getElementById("detalhes");
    const areaDownload = document.getElementById("area-download");
    const btnDownload = document.getElementById("btn-download");
    const downloadMsg = document.getElementById("download-msg");
    const tituloProduto = document.getElementById("tituloProduto");

    // Título dinâmico conforme o produto do checkout
    (function aplicarTitulo() {
      const nomeSalvo = localStorage.getItem("checkout_produto_nome");
      const idSalvo = localStorage.getItem("checkout_produto_id");
      const nome = nomeSalvo || NOMES[idSalvo] || "Seu curso digital";
      tituloProduto.textContent = nome;
      document.title = "Pagamento | " + nome;
    })();

    let intervalId = null;

    async function verificarPagamento() {
      const externalReference =
        localStorage.getItem("checkout_external_reference");

      if (!externalReference) {
        mensagem.textContent = "Não foi possível localizar o pedido neste navegador.";
        mensagem.className = "erro";
        detalhes.innerHTML = 'Recupere com o e-mail da compra: <a href="./acesso.html" style="color:#16a34a;font-weight:bold">Acessar meus cursos</a>';
        return;
      }

      try {
        const resposta = await fetch(API_CONSULTAR, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ external_reference: externalReference })
        });

        const resultado = await resposta.json();

        if (resultado.confirmado) {
          mensagem.textContent = "Pagamento confirmado! ✅";
          mensagem.className = "confirmado";
          detalhes.textContent = "Seu pagamento foi confirmado com sucesso.";
          areaDownload.style.display = "block";

          if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
          }
        } else {
          mensagem.textContent = "Aguardando confirmação do pagamento...";
          mensagem.className = "aguardando";
          detalhes.textContent =
            "Esta página verificará novamente em alguns segundos.";
        }
      } catch (erro) {
        mensagem.textContent =
          "Não foi possível verificar o pagamento agora.";
        mensagem.className = "erro";
      }
    }

    async function baixarEbook() {
      const externalReference =
        localStorage.getItem("checkout_external_reference");

      if (!externalReference) {
        downloadMsg.textContent = "Pedido não encontrado.";
        downloadMsg.className = "download-erro";
        return;
      }

      btnDownload.disabled = true;
      btnDownload.textContent = "Gerando link seguro...";
      downloadMsg.textContent = "";
      downloadMsg.className = "";

      try {
        const resposta = await fetch(API_DOWNLOAD, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ external_reference: externalReference })
        });

        const dados = await resposta.json();

        if (!resposta.ok || !dados.sucesso || !dados.url) {
          throw new Error(
            dados.erro || "Não foi possível gerar o link de download."
          );
        }

        // Se a API devolver o nome do produto, atualiza o título
        if (dados.produto_nome) {
          tituloProduto.textContent = dados.produto_nome;
          document.title = "Pagamento | " + dados.produto_nome;
        }

        window.open(dados.url, "_blank");

        downloadMsg.textContent =
          "Link gerado com sucesso. O download deve iniciar em breve. O link expira em 1 hora.";
        btnDownload.textContent = "Baixar novamente";
      } catch (erro) {
        console.error(erro);
        downloadMsg.textContent = erro.message || "Erro ao gerar download.";
        downloadMsg.className = "download-erro";
        btnDownload.textContent = "Tentar novamente";
      } finally {
        btnDownload.disabled = false;
      }
    }

    btnDownload.addEventListener("click", baixarEbook);

    verificarPagamento();
    intervalId = setInterval(verificarPagamento, 5000);
  </script>
</body>
</html>
