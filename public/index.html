<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Checkout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      line-height: 1.6;
      color: #555;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      margin: 25px 0;
    }

    .button {
      display: inline-block;
      width: 100%;
      padding: 16px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="card">

      <h1>Meu Infoproduto</h1>

      <p>
        Acesse seu produto através do nosso checkout seguro.
      </p>

      <div class="price">
        R$ 0,05
      </div>

      <a class="button" href="./checkout.html?produto=1">
        Comprar agora
      </a>

    </div>
  </main>

</body>
</html>
